<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            <h2>SMS</h2>
            <p>Student Management</p>
        </div>

        <nav>

            <a href="index.html" class="menu">
                🏠 Dashboard
            </a>

            <a href="students.html" class="menu">
                👨‍🎓 Students
            </a>

            <a href="attendance.html" class="menu">
                📅 Attendance
            </a>

            <a href="exams.html" class="menu">
                📝 Exams & Marks
            </a>

            <a href="result.html" class="menu">
                📄 Result
            </a>

            <a href="fees.html" class="menu">
                💰 Fees
            </a>

            <a href="reports.html" class="menu">
                📊 Reports
            </a>

            <a href="settings.html" class="menu active">
                ⚙️ Settings
            </a>

        </nav>

    </aside>

    <main class="main-content">

        <header class="top-header">

            <div>
                <h1>Settings</h1>
                <p>Manage system settings</p>
            </div>

            <div class="profile">

                <div class="profile-icon">
                    A
                </div>

                <div>
                    <strong>Admin</strong>
                    <small>Administrator</small>
                </div>

            </div>

        </header>

        <section class="form-card">

            <h2>Admin Profile</h2>

            <form id="settingsForm">

                <div class="form-group">
                    <label for="adminName">Admin Name</label>

                    <input
                        type="text"
                        id="adminName"
                        value="Admin"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        value="admin"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                    >
                </div>

                <button type="submit">
                    Save Settings
                </button>

            </form>

            <p id="settingsMessage"></p>

        </section>

    </main>

    <script src="settings.js"></script>
    <script src="auth.js"></script>

</body>
</html>
