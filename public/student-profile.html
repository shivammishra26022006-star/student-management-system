<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <h2>SMS</h2>

            <p>Student Management</p>

        </div>


        <nav>

            <a href="index.html" class="menu">
                🏠 Dashboard
            </a>

            <a href="students.html" class="menu active">
                👨‍🎓 Students
            </a>

            <a href="#" class="menu">
                📅 Attendance
            </a>

            <a href="#" class="menu">
                📝 Exams & Marks
            </a>

            <a href="#" class="menu">
                💰 Fees
            </a>

            <a href="#" class="menu">
                📊 Reports
            </a>

        </nav>

    </aside>


    <!-- Main Content -->

    <main class="main-content">

        <header class="top-header">

            <div>

                <h1>Student Profile</h1>

                <p>
                    Complete student information
                </p>

            </div>

        </header>


        <!-- Profile -->

        <section class="content-box">

            <div class="profile-page">

                <div class="big-profile-icon">
                    👨‍🎓
                </div>

                <div>

                    <h2 id="studentName">
                        Loading...
                    </h2>

                    <p id="studentCourse">
                        Loading...
                    </p>

                </div>

            </div>


            <hr>


            <div class="profile-grid">

                <div class="profile-item">

                    <span>Student ID</span>

                    <strong id="studentId">
                        -
                    </strong>

                </div>


                <div class="profile-item">

                    <span>Roll Number</span>

                    <strong id="rollNumber">
                        -
                    </strong>

                </div>


                <div class="profile-item">

                    <span>Email</span>

                    <strong id="email">
                        -
                    </strong>

                </div>


                <div class="profile-item">

                    <span>Phone</span>

                    <strong id="phone">
                        -
                    </strong>

                </div>


                <div class="profile-item">

                    <span>Gender</span>

                    <strong id="gender">
                        -
                    </strong>

                </div>


                <div class="profile-item">

                    <span>Date of Birth</span>

                    <strong id="dateOfBirth">
                        -
                    </strong>

                </div>


                <div class="profile-item">

                    <span>Address</span>

                    <strong id="address">
                        -
                    </strong>

                </div>

            </div>


            <br>


            <a
                href="students.html"
                class="back-button">

                ← Back to Students

            </a>

        </section>

    </main>


    <script src="student-profile.js"></script>
<script src="auth.js"></script>
</body>
</html>
