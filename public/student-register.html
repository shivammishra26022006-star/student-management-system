<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Registration - Student Management System</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>
                Student Management System
            </h1>

            <p>
                Create Your Student Account
            </p>


            <form id="studentRegisterForm">


                <!-- =====================================
                     PERSONAL INFORMATION
                ====================================== -->

                <h2>
                    Personal Information
                </h2>


                <div class="form-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerDob">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="registerDob"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerGender">
                        Gender
                    </label>

                    <select
                        id="registerGender"
                        required
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter email address"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="registerPhone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerAddress">
                        Address
                    </label>

                    <textarea
                        id="registerAddress"
                        placeholder="Enter complete address"
                        rows="3"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="registerCity">
                        City
                    </label>

                    <input
                        type="text"
                        id="registerCity"
                        placeholder="Enter city"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerState">
                        State
                    </label>

                    <input
                        type="text"
                        id="registerState"
                        placeholder="Enter state"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPincode">
                        PIN Code
                    </label>

                    <input
                        type="text"
                        id="registerPincode"
                        placeholder="Enter PIN code"
                        required
                    >

                </div>


                <!-- =====================================
                     ACADEMIC INFORMATION
                ====================================== -->

                <hr>

                <h2>
                    Academic Information
                </h2>


                <div class="form-group">

                    <label for="registerStudentId">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="registerStudentId"
                        placeholder="Enter student ID"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerRollNumber">
                        Roll Number
                    </label>

                    <input
                        type="text"
                        id="registerRollNumber"
                        placeholder="Enter roll number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerCourse">
                        Course
                    </label>

                    <select
                        id="registerCourse"
                        required
                    >

                        <option value="">
                            Select Course
                        </option>

                        <option value="BCA">
                            BCA
                        </option>

                        <option value="BBA">
                            BBA
                        </option>

                        <option value="BSc">
                            B.Sc
                        </option>

                        <option value="BA">
                            B.A
                        </option>

                        <option value="BCom">
                            B.Com
                        </option>

                        <option value="MCA">
                            MCA
                        </option>

                        <option value="MBA">
                            MBA
                        </option>

                        <option value="MSc">
                            M.Sc
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="registerDepartment">
                        Department
                    </label>

                    <input
                        type="text"
                        id="registerDepartment"
                        placeholder="Enter department"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerSemester">
                        Semester / Year
                    </label>

                    <select
                        id="registerSemester"
                        required
                    >

                        <option value="">
                            Select Semester / Year
                        </option>

                        <option value="1st Semester">
                            1st Semester
                        </option>

                        <option value="2nd Semester">
                            2nd Semester
                        </option>

                        <option value="3rd Semester">
                            3rd Semester
                        </option>

                        <option value="4th Semester">
                            4th Semester
                        </option>

                        <option value="5th Semester">
                            5th Semester
                        </option>

                        <option value="6th Semester">
                            6th Semester
                        </option>

                        <option value="1st Year">
                            1st Year
                        </option>

                        <option value="2nd Year">
                            2nd Year
                        </option>

                        <option value="3rd Year">
                            3rd Year
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="registerAcademicYear">
                        Academic Year
                    </label>

                    <select
                        id="registerAcademicYear"
                        required
                    >

                        <option value="">
                            Select Academic Year
                        </option>

                        <option value="2025-2026">
                            2025-2026
                        </option>

                        <option value="2026-2027">
                            2026-2027
                        </option>

                        <option value="2027-2028">
                            2027-2028
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="registerCollege">
                        College / Institute
                    </label>

                    <input
                        type="text"
                        id="registerCollege"
                        placeholder="Enter college / institute name"
                        required
                    >

                </div>


                <!-- =====================================
                     GUARDIAN INFORMATION
                ====================================== -->

                <hr>

                <h2>
                    Parent / Guardian Information
                </h2>


                <div class="form-group">

                    <label for="registerGuardianName">
                        Parent / Guardian Name
                    </label>

                    <input
                        type="text"
                        id="registerGuardianName"
                        placeholder="Enter parent / guardian name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerGuardianRelation">
                        Relationship
                    </label>

                    <select
                        id="registerGuardianRelation"
                        required
                    >

                        <option value="">
                            Select Relationship
                        </option>

                        <option value="Father">
                            Father
                        </option>

                        <option value="Mother">
                            Mother
                        </option>

                        <option value="Guardian">
                            Guardian
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="registerGuardianPhone">
                        Guardian Phone
                    </label>

                    <input
                        type="tel"
                        id="registerGuardianPhone"
                        placeholder="Enter guardian phone"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerEmergencyContact">
                        Emergency Contact
                    </label>

                    <input
                        type="tel"
                        id="registerEmergencyContact"
                        placeholder="Enter emergency contact"
                        required
                    >

                </div>


                <!-- =====================================
                     ACCOUNT INFORMATION
                ====================================== -->

                <hr>

                <h2>
                    Account Information
                </h2>


                <div class="form-group">

                    <label for="registerUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="registerUsername"
                        placeholder="Create username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="registerConfirmPassword"
                        placeholder="Confirm password"
                        required
                    >

                </div>


                <button type="submit">
                    Create Student Account
                </button>


            </form>


            <p id="registerMessage"></p>


            <p>
                Already have an account?

                <a href="user-login.html">
                    Student Login
                </a>
            </p>


        </div>

    </div>


    <script src="student-register.js"></script>

</body>

</html>
