<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exams & Marks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <aside class="sidebar">
            <h2>Student MS</h2>

            <a href="index.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="attendance.html">Attendance</a>
            <a href="exams.html" class="active">Exams & Marks</a>
            <a href="#">Fees</a>
            <a href="#">Reports</a>
        </aside>

        <main class="main-content">

            <h1>Exams & Marks</h1>

            <div class="form-card">

                <h2>Add Marks</h2>

                <form id="marksForm">

                    <div class="form-group">
                        <label for="student">Student</label>
                        <select id="student" required>
                            <option value="">Select Student</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="exam_name">Exam Name</label>
                        <input type="text" id="exam_name" placeholder="Enter exam name" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" placeholder="Enter subject" required>
                    </div>

                    <div class="form-group">
                        <label for="marks">Marks</label>
                        <input type="number" id="marks" placeholder="Enter marks" min="0" max="100" required>
                    </div>

                    <button type="submit">Save Marks</button>

                </form>

            </div>

            <div class="table-card">

                <h2>Marks Records</h2>

                <input
                    type="text"
                    id="marksSearch"
                    placeholder="Search student, exam or subject..."
                >

                <div class="table-wrapper">

                    <table>

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Student</th>
                                <th>Roll No</th>
                                <th>Exam</th>
                                <th>Subject</th>
                                <th>Marks</th>
                                <th>Result</th>
                            </tr>
                        </thead>

                        <tbody id="marksTable">
                            <tr>
                                <td colspan="7">No marks records found.</td>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    <script src="exams.js"></script>
<script src="auth.js"></script>

</body>
</html>
